[tools]
# https://go.dev/
go = "1.25"
# https://github.com/azat-io/actions-up
"npm:actions-up" = "1"
# https://github.com/paulhatch/semantic-version
"npm:@semanticversion/cli" = "latest"
# https://golangci-lint.run/
golangci-lint = "2"
"github:jj-vcs/jj" = "latest"
lazydocker = "latest"
kopia = "latest"

[tasks.tidy]
description = "整理 Go 模块依赖"
run = "go mod tidy"

[tasks.update]
description = "更新 Go 第三方库并整理模块依赖"
run = "go get -u ./... && go mod tidy"

[tasks.test]
description = "运行 Go 测试"
run = "go test -v ./..."

[tasks.test-e2e-container]
description = "运行容器 Kopia 端到端测试"
run = "go test -tags=e2e -run '^TestRevopiaE2E$' -v ."

[tasks.test-e2e-host]
description = "运行宿主机 Kopia 端到端测试"
run = "go test -tags=e2e -run '^TestRevopiaHostE2E$' -v ."

[tasks.test-e2e]
description = "运行 Kopia Docker volume 端到端测试"
run = "go test -tags=e2e -run 'TestRevopia.*E2E' -v ."

[tasks.fmt]
description = "检查 Go 代码格式"
raw = true
run = "golangci-lint fmt -E gofmt --diff"

[tasks.vet]
description = "运行 Go 静态检查"
raw = true
run = "go vet ./..."

[tasks.lint]
description = "运行 Go lint 检查"
raw = true
run = "golangci-lint run"

[tasks.check]
description = "运行 Go 格式、静态检查、构建和 lint"
run = [
  { task = "fmt" },
  { task = "vet" },
  { task = "build" },
  { task = "lint" },
]

[tasks.run]
description = "运行 CLI"
run = "go run ."

[tasks.'action:update']
description = "交互式更新 GitHub Action 版本并默认固定为提交哈希"
run = "actions-up"

[tasks.'action:update:all']
description = "自动更新全部 GitHub Action 版本并默认固定为提交哈希"
run = "actions-up --yes"

[tasks.'docs:install']
description = "安装文档站依赖"
dir = "docs"
run = "pnpm install"

[tasks.'docs:dev']
description = "启动 VitePress 文档站"
depends = ["docs:install"]
dir = "docs"
run = "pnpm dev"

[tasks.'docs:build']
description = "构建 VitePress 文档站"
depends = ["docs:install"]
dir = "docs"
run = "pnpm build"

[tasks.'docs:preview']
description = "预览 VitePress 文档站"
depends = ["docs:install"]
dir = "docs"
run = "pnpm preview"

[shell_alias]
# Means "Kopia in Docker" and "Kopia on Host"
kopiad = "docker compose exec -T kopia kopia"
kopiah = "sudo -u kopia kopia"
# Same as Kopia alias, but for Revopia
revopiad = "docker compose exec -T kopia revopia"
revopiah = "sudo -u kopia revopia"
# Kopia user do
kudo = "sudo -u kopia"
exec-kopia = "docker compose exec kopia"
