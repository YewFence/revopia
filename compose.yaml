name: revopia

# 默认启动只使用官方 Kopia 镜像，revopia 由 install profile 写入工具卷。
# 首次部署缺少证书时，可以在 kopia 服务 command 中临时加入 Kopia 自己的 --tls-generate-cert 参数。
# 如果只在可信内网测试，也可以把 kopia 服务 command 里的 TLS 参数换成 --insecure。
# 宿主机需要提前满足 Linux Docker Engine、shared bridge mount 和 docker.sock proxy 访问这些前提。

services:
  kopia:
    image: kopia/kopia:${KOPIA_VERSION:-latest}
    hostname: ${KOPIA_HOSTNAME:-kopia}
    restart: unless-stopped
    init: true
    depends_on:
      - docker-socket-proxy
    networks:
      - default
      - docker-api
    ports:
      - "${KOPIA_BIND_HOST:-127.0.0.1}:${KOPIA_BIND_PORT:-51515}:51515"
    environment:
      PATH: /tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      USER: ${KOPIA_OS_USER:-kopia}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      KOPIA_PASSWORD: ${KOPIA_PASSWORD:-change-this-repository-password}
      REVOPIA_BRIDGE_SOURCE: /mnt/revopia
      REVOPIA_VISIBLE_ROOT: /volumes
      REVOPIA_RESTORE_ROOT: /restore
      REVOPIA_LOG_FILE: /app/logs/revopia.log
      REVOPIA_HELPER_IMAGE: ${REVOPIA_HELPER_IMAGE:-alpine:latest}
    command:
      - server
      - start
      - --enable-actions
      - --address=0.0.0.0:51515
      # 首次启动且没有 ./data/kopia/config/tls/server.crt 和 server.key 时，临时加入下面两项让 Kopia 生成自签证书，生成后再移除。
      # - --tls-generate-cert
      # - --tls-generate-cert-name=${KOPIA_TLS_CERT_NAME:-127.0.0.1,localhost}
      - --tls-cert-file=/app/config/tls/server.crt
      - --tls-key-file=/app/config/tls/server.key
      # 如果不需要 TLS(如内网/私网环境)，可以换成下面这一行并移除上面的 TLS 相关参数。
      # - --insecure
      - --server-username=${KOPIA_SERVER_USERNAME:-kopia}
      - --server-password=${KOPIA_SERVER_PASSWORD:-change-this-ui-password}
      - --server-control-username=${KOPIA_SERVER_CONTROL_USERNAME:-server-control}
      - --server-control-password=${KOPIA_SERVER_CONTROL_PASSWORD:-change-this-control-password}
    volumes:
      - kopia-config:/app/config
      - kopia-cache:/app/cache
      - kopia-repository:/repository
      - ./logs:/app/logs
      - ./tools:/tools/revopia:ro
      - /mnt/revopia:/volumes:rshared
      - /mnt/revopia/restore:/restore:rslave

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:${DOCKER_SOCKET_PROXY_VERSION:-v0.4.2}
    restart: unless-stopped
    privileged: true
    networks:
      - docker-api
    environment:
      LOG_LEVEL: ${DOCKER_SOCKET_PROXY_LOG_LEVEL:-info}
      DISABLE_IPV6: "1"
      EVENTS: "0"
      PING: "1"
      VERSION: "1"
      POST: "1"
      CONTAINERS: "1"
      VOLUMES: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  revopia-install:
    image: alpine:latest
    profiles:
      - install
    restart: "no"
    environment:
      VERSION: ${VERSION:-}
      REVOPIA_VERSION: ${REVOPIA_VERSION:-}
      REVOPIA_REPO: ${REVOPIA_REPO:-yewfence/revopia}
      REVOPIA_INSTALL_URL: ${REVOPIA_INSTALL_URL:-https://raw.githubusercontent.com/yewfence/revopia/main/scripts/install.sh}
    command:
      - sh
      - -eu
      - -c
      - |
        apk add --no-cache ca-certificates curl jq
        curl -fsSL "$${REVOPIA_INSTALL_URL}" | REVOPIA_INSTALL_PATH=/tools/revopia sh
    volumes:
      - ./tools:/tools

networks:
  docker-api:
    internal: true

volumes:
  kopia-config:
  kopia-cache:
  kopia-repository:
