services:
  kopia:
    image: kopia/kopia:unstable
    hostname: kopia-test
    ports:
      - "51515:51515"
    environment:
      KOPIA_PASSWORD: kopia
      USER: kopia
      KOPIA_VOLUME_BRIDGE_LOG_FILE: /app/logs/volume-bridge.log
      KOPIA_VOLUME_BRIDGE_VISIBLE_ROOT: /volumes
    volumes:
      - kopia-config:/app/config
      - kopia-cache:/app/cache
      - ./logs:/app/logs
      - kopia-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/volumes-backup:/volumes:rshared
      - /mnt/volumes-backup/restore:/restore:rslave
      - ./bin/volume-backup:/bin/volume-backup
    stdin_open: true
    tty: true
    command:
      - server
      - start
      - --disable-csrf-token-checks
      - --enable-actions
      - --insecure
      - --address=0.0.0.0:51515
      - --server-username=kopia
      - --server-password=kopia

  test-volumes:
    image: alpine:latest
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /seed/db /seed/cache /seed/logs
        printf '%s\n' 'db volume ready' > /seed/db/README.txt
        printf '%s\n' 'cache volume ready' > /seed/cache/README.txt
        printf '%s\n' 'logs volume ready' > /seed/logs/README.txt
    volumes:
      - test-db-data:/seed/db
      - test-cache-data:/seed/cache
      - test-logs-data:/seed/logs

volumes:
  kopia-config:
  kopia-cache:
  kopia-data:
  test-db-data:
    labels:
      backup.enable: "true"
      backup.name: "db-primary"
  test-cache-data:
    labels:
      backup.enable: "true"
      backup.name: "cache tmp"
  test-logs-data:
    labels:
      backup.enable: "true"
